<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교폭력 예방 교육 연수 등록부</title>
    <style>
        /* 세종여고 CI 기반 컬러 테마 적용 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f7f5fa; padding: 20px; }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(102, 44, 145, 0.1); 
            border-top: 6px solid #662C91; /* 세종여고 메인 보라색 */
        }
        
        /* 몽련이 야호 이미지 스타일 */
        .mascot-img { display: block; margin: 0 auto 15px auto; width: 130px; }
        
        h1 { text-align: center; color: #662C91; margin-bottom: 5px; font-size: 24px; letter-spacing: -0.5px; }
        h2 { text-align: center; color: #7F7F7F; margin-bottom: 30px; font-size: 17px; font-weight: normal; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #444; }
        input[type="text"], input[type="date"] { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 6px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            border-color: #662C91; outline: none;
        }
        
        canvas { border: 2px dashed #ccc; border-radius: 6px; background-color: #fafafa; cursor: crosshair; touch-action: none; width: 100%; height: 160px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 14px 15px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 16px; transition: background-color 0.2s; }
        .btn-submit { background-color: #662C91; flex: 2; } /* 세종여고 보라색 */
        .btn-submit:hover { background-color: #522275; }
        .btn-clear { background-color: #7F7F7F; flex: 1; } /* 세종여고 회색 */
        .btn-clear:hover { background-color: #666; }
        
        /* 맨 아래 세종여자고등학교 CI 로고 영역 */
        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            color: #555;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .footer-logo img { height: 45px; margin-right: 12px; }

        /* 로딩 오버레이 스타일 */
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); color: white; font-size: 20px; font-weight: bold; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #662C91; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    데이터를 안전하게 전송 중입니다...
</div>

<div class="container">
    <!-- 2번 그림 (몽련이 야호) -->
    <img src="몽련이 야호.jpg" alt="몽련이 캐릭터" class="mascot-img">

    <h1>교직원 대상 학교폭력 예방 교육</h1>
    <h2>온라인 연수 등록부</h2>
    
    <div class="form-group">
        <label for="date">연수 일자</label>
        <input type="date" id="date">
    </div>
    
    <div class="form-group">
        <label for="affiliation">소속</label>
        <input type="text" id="affiliation" value="세종여자고등학교" readonly style="background-color: #f0f0f0; color: #666;">
    </div>

    <div class="form-group">
        <label for="name">성명</label>
        <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>

    <div class="form-group">
        <label>서명 (아래 영역에 마우스나 터치로 서명해주세요)</label>
        <canvas id="signaturePad"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-clear" type="button" onclick="clearCanvas()">서명 지우기</button>
        <button class="btn-submit" type="button" onclick="submitToGoogleSheets()">등록 완료</button>
    </div>

    <!-- 1번 그림 (세종여고 CI) 및 텍스트 -->
    <div class="footer-logo">
        <img src="세종여자고등학교 CI.png" alt="세종여자고등학교 로고">
        <span>세종여자고등학교</span>
    </div>
</div>

<script>
    // ★★★ 구글 앱스 스크립트에서 복사한 '웹앱 URL'을 아래 따옴표 안에 꼭 붙여넣으세요! ★★★
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiyurPn5RD95BKNzCBme_nRhhdmPga7Rja_mceZ5DH1oLrvcZZdrcAQYOxNHBsaHRL7w/exec";

    document.getElementById('date').valueAsDate = new Date();

    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasDrawn = false;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const startDrawing = (e) => {
        isDrawing = true;
        hasDrawn = true;
        draw(e);
    };

    const stopDrawing = () => {
        isDrawing = false;
        ctx.beginPath();
    };

    const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#333';
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    };

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
    }

    function submitToGoogleSheets() {
        if (SCRIPT_URL === "여기에_복사한_웹앱_URL을_붙여넣으세요") {
            alert('웹앱 URL이 입력되지 않았습니다. 소스 코드의 SCRIPT_URL을 확인해주세요.');
            return;
        }

        const name = document.getElementById('name').value.trim();
        const affiliation = document.getElementById('affiliation').value.trim();
        const date = document.getElementById('date').value;
        
        if (!name || !affiliation || !date) {
            alert('연수 일자, 소속, 성명을 모두 입력해주세요.');
            return;
        }
        
        if (!hasDrawn) {
            alert('서명을 입력해주세요.');
            return;
        }

        const signatureDataUrl = canvas.toDataURL();
        
        const data = {
            date: date,
            affiliation: affiliation,
            name: name,
            signature: signatureDataUrl
        };

        document.getElementById('loadingOverlay').style.display = 'flex';

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if(response.ok) {
                alert('등록이 완료되었습니다. 감사합니다!');
                document.getElementById('name').value = '';
                clearCanvas();
            } else {
                alert('전송 중 오류가 발생했습니다. 다시 시도해주세요.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('서버와 연결할 수 없습니다.');
        })
        .finally(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
        });
    }
</script>
</body>
</html>
