<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교폭력 예방 교육 연수 등록부</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 24px; }
        h2 { text-align: center; color: #666; margin-bottom: 25px; font-size: 18px; font-weight: normal; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;}
        canvas { border: 2px dashed #bbb; border-radius: 4px; background-color: #fafafa; cursor: crosshair; touch-action: none; width: 100%; height: 150px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 16px; }
        .btn-submit { background-color: #4CAF50; flex: 2; }
        .btn-clear { background-color: #f44336; flex: 1; }
        
        /* 로딩 오버레이 스타일 */
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); color: white; font-size: 20px; font-weight: bold; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="loadingOverlay">데이터를 전송 중입니다... 잠시만 기다려주세요.</div>

<div class="container">
    <h1>교직원 대상 학교폭력 예방 교육</h1>
    <h2>온라인 연수 등록부</h2>
    
    <div class="form-group">
        <label for="date">연수 일자</label>
        <input type="date" id="date">
    </div>
    
    <div class="form-group">
        <label for="affiliation">소속</label>
        <input type="text" id="affiliation" value="세종여자고등학교">
    </div>

    <div class="form-group">
        <label for="name">성명</label>
        <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>

    <div class="form-group">
        <label>서명 (아래 영역에 마우스나 터치로 서명해주세요)</label>
        <canvas id="signaturePad"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-clear" type="button" onclick="clearCanvas()">서명 지우기</button>
        <button class="btn-submit" type="button" onclick="submitToGoogleSheets()">등록 완료</button>
    </div>
</div>

<script>
    // ★★★ 구글 앱스 스크립트에서 복사한 '웹앱 URL'을 아래 따옴표 안에 꼭 붙여넣으세요! ★★★
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiyurPn5RD95BKNzCBme_nRhhdmPga7Rja_mceZ5DH1oLrvcZZdrcAQYOxNHBsaHRL7w/exec";

    document.getElementById('date').valueAsDate = new Date();

    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasDrawn = false; // 서명 여부 체크

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const startDrawing = (e) => {
        isDrawing = true;
        hasDrawn = true;
        draw(e);
    };

    const stopDrawing = () => {
        isDrawing = false;
        ctx.beginPath();
    };

    const draw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    };

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
    }

    function submitToGoogleSheets() {
        if (SCRIPT_URL === "여기에_복사한_웹앱_URL을_붙여넣으세요") {
            alert('웹앱 URL이 입력되지 않았습니다. 소스 코드의 SCRIPT_URL을 확인해주세요.');
            return;
        }

        const name = document.getElementById('name').value.trim();
        const affiliation = document.getElementById('affiliation').value.trim();
        const date = document.getElementById('date').value;
        
        if (!name || !affiliation || !date) {
            alert('연수 일자, 소속, 성명을 모두 입력해주세요.');
            return;
        }
        
        if (!hasDrawn) {
            alert('서명을 입력해주세요.');
            return;
        }

        const signatureDataUrl = canvas.toDataURL();
        
        const data = {
            date: date,
            affiliation: affiliation,
            name: name,
            signature: signatureDataUrl
        };

        document.getElementById('loadingOverlay').style.display = 'flex';

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(data)
        })
        .then(response => {
            if(response.ok) {
                alert('등록이 완료되었습니다. 감사합니다!');
                document.getElementById('name').value = '';
                clearCanvas();
            } else {
                alert('전송 중 오류가 발생했습니다. 다시 시도해주세요.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('서버와 연결할 수 없습니다.');
        })
        .finally(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
        });
    }
</script>
</body>
</html>
